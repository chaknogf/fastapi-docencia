[tool.poetry]
name = "fastapi-docencia"
version = "3.0.0"
description = "Backend de gestión de docencia y capacitaciones"
authors = ["chaknogf <chaknogf@gmail.com>"]
license = "gpl"
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
# Web Framework
fastapi = "^0.115.0"
uvicorn = {version = "^0.32.0", extras = ["standard"]}
python-multipart = "^0.0.12"

# Database
sqlalchemy = "^2.0.36"
psycopg2-binary = "^2.9.10"

# Security
python-jose = {version = "^3.3.0", extras = ["cryptography"]}
passlib = {version = "^1.7.4", extras = ["argon2"]}
argon2-cffi = "^23.1.0"
cryptography = "^44.0.0"

# Validation
pydantic = "^2.10.0"
pydantic-settings = "^2.7.0"
email-validator = "^2.2.0"

# Configuration
python-dotenv = "^1.0.1"

# Email
fastapi-mail = "^1.4.1"
aiosmtplib = "^3.0.2"

# Scheduler
apscheduler = "^3.10.4"

# Reports
openpyxl = "^3.1.5"

# Utilities
httpx = "^0.28.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.24.0"
httpx = "^0.28.1"
black = "^24.0.0"
ruff = "^0.8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "COM", "C4", "DTZ", "T20", "PT", "RUF"]
ignore = ["S101", "S104"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
